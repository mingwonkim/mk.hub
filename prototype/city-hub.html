<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MK.HUB City — 프로토타입</title>
<style>
:root{--bg:#090D16;--surf:#161E2A;--glass:rgba(22,30,42,.42);--line:rgba(244,246,250,.14);--tx:#F4F6FA;--tx2:#B8C4D8;--pink:#F2AACB;--focus:#A9DDF3;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif}
body{height:320vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

/* 도시 무대: 16:9 이미지를 화면 꽉 채우고, 광고판 핫스팟은 이미지 기준 % 좌표 */
.viewport{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);aspect-ratio:16/9;translate:-50% -50%;
  background:url(../assets/v2/city-20-low.webp) center/cover;transition:transform 1.4s var(--ease),filter 1.4s var(--ease);will-change:transform}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,13,22,.35),transparent 30%,transparent 60%,rgba(9,13,22,.7));pointer-events:none}

/* 광고판 = 저장소 입구 */
.bb{position:absolute;border-radius:6px;transition:box-shadow .25s,background .25s}
.bb:hover,.bb:focus-visible{background:rgba(242,170,203,.10);box-shadow:0 0 0 2px var(--pink),0 0 40px rgba(242,170,203,.55)}
.bb .tag{position:absolute;left:calc(100% + 12px);top:12px;white-space:nowrap;padding:6px 12px;border-radius:999px;font-size:14px;
  background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);opacity:.85;transition:opacity .2s,background .2s}
.bb:hover .tag,.bb:focus-visible .tag{opacity:1;background:var(--surf)}
.bb .tag b{color:var(--pink);font-weight:600;margin-right:6px}

/* 유리 패널: 기본 반투명 → hover/focus-within 불투명 */
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:16px;transition:background .16s ease-out}
.glass:hover,.glass:focus-within{background:var(--surf)}

.nav{position:fixed;top:16px;left:24px;right:24px;height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;z-index:5}
.nav .logo{font-weight:700;letter-spacing:.08em}
.nav .search{flex:1;max-width:420px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(9,13,22,.35);color:var(--tx);padding:0 14px}
.nav .sp{flex:1}
.nav .chip{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);color:var(--tx2)}

.today{position:fixed;right:24px;top:96px;width:340px;padding:20px;z-index:4;transition:opacity .4s,transform .4s var(--ease)}
.today h2{font-size:14px;color:var(--tx2);font-weight:600;letter-spacing:.04em;margin-bottom:8px}
.today ul{list-style:none;padding:0;margin-bottom:16px}
.today li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.today li span{color:var(--tx2);font-size:13px}
.today .chk{justify-content:flex-start;gap:10px;align-items:center}
.today .chk i{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--tx2);flex:none}

.hint.off{opacity:0}
.hint{position:fixed;left:50%;bottom:28px;translate:-50% 0;padding:10px 18px;font-size:14px;color:var(--tx2);z-index:4;transition:opacity .3s}
.hint b{color:var(--tx)}

/* 열기구 */
.balloon{position:fixed;left:62%;top:100%;width:180px;z-index:3;pointer-events:none;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}

/* 목적지 선택 */
.picker{position:fixed;left:50%;bottom:40px;translate:-50% 0;width:min(1080px,calc(100vw - 48px));padding:24px;z-index:6;opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .24s var(--ease),transform .24s var(--ease)}
.picker.on{opacity:1;transform:none;pointer-events:auto}
.picker h2{font-size:20px;margin-bottom:4px}
.picker p{color:var(--tx2);font-size:14px;margin-bottom:16px}
.dests{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.dest{text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line);background:rgba(9,13,22,.35);min-height:44px;transition:background .16s,border-color .16s}
.dest:hover,.dest:focus-visible{background:var(--surf);border-color:var(--pink)}
.dest b{display:block;font-size:16px}
.dest span{font-size:13px;color:var(--tx2)}

/* 이동 연출 */
.flash{position:fixed;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#fff 0,#F2AACB 35%,#090D16 80%);opacity:0;pointer-events:none;z-index:7;transition:opacity .5s}
body.travel .flash{opacity:1;transition-delay:.9s}
body.travel .today,body.travel .hint,body.travel .picker{opacity:0;pointer-events:none}

/* 도착 화면 (불투명 작업 패널) */
.room{position:fixed;inset:0;z-index:8;display:none;place-items:center;background:linear-gradient(180deg,#1a1424,#090D16)}
.room.on{display:grid;animation:in .24s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.panel{width:min(1100px,calc(100vw - 48px));height:min(640px,calc(100vh - 120px));display:grid;grid-template-columns:224px 300px 1fr;background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.panel>div{padding:20px;border-right:1px solid var(--line)}
.panel h3{font-size:14px;color:var(--tx2);margin-bottom:12px}
.panel .row{padding:10px 12px;border-radius:10px;font-size:15px}
.panel .row.sel{background:rgba(242,170,203,.12);color:var(--pink)}
.panel .ed h2{font-size:28px;margin-bottom:8px}
.panel .ed p{color:var(--tx2)}
.panel .ed .st{margin-top:16px;font-size:13px;color:var(--focus)}
.back{position:fixed;top:24px;left:24px;height:44px;padding:0 16px;border-radius:10px;background:var(--surf);border:1px solid var(--line);z-index:9}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){.today{display:none}.dests{grid-template-columns:repeat(2,1fr)}.panel{grid-template-columns:1fr}.panel>div:not(.ed){display:none}}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <!-- 핫스팟 좌표: city-20 (1376×768) 광고판 위치 기준 -->
    <button class="bb" style="left:32%;top:11.5%;width:6.3%;height:32%" data-dest="Vault"><span class="tag"><b>Vault</b>프로젝트 저장소</span></button>
    <button class="bb" style="left:32.8%;top:43.5%;width:5.7%;height:17%" data-dest="Brief"><span class="tag"><b>Brief</b>모닝 브리프</span></button>
    <button class="bb" style="left:38.4%;top:59%;width:7.4%;height:40%" data-dest="Music"><span class="tag"><b>Music</b>작곡 스튜디오</span></button>
    <button class="bb" style="left:9%;top:65%;width:6.3%;height:29%" data-dest="Gallery"><span class="tag"><b>Gallery</b>전시관</span></button>
  </div>
  <div class="shade"></div>
</div>

<header class="nav glass">
  <span class="logo">MK.HUB</span>
  <input class="search" placeholder="메모·파일·할 일 검색" aria-label="검색">
  <span class="sp"></span>
  <button class="chip">설정</button>
  <button class="chip">잠금</button>
</header>

<aside class="today glass" aria-label="오늘">
  <h2>최근 자료</h2>
  <ul>
    <li>신곡 가사 초안 <span>메모 · 2시간 전</span></li>
    <li>포트폴리오 리서치 <span>파일 · 어제</span></li>
    <li>모델 학습 메모 <span>메모 · 3일 전</span></li>
  </ul>
  <h2>오늘 할 일</h2>
  <ul>
    <li class="chk"><i></i>훅 멜로디 녹음</li>
    <li class="chk"><i></i>원단 샘플 정리</li>
    <li class="chk"><i></i>논문 2편 읽기</li>
  </ul>
</aside>

<div class="hint glass" id="hint">광고판을 눌러 바로 이동 · <b>스크롤</b>하면 열기구가 와요</div>

<svg class="balloon" id="balloon" viewBox="0 0 120 170" aria-hidden="true">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2AACB"/><stop offset=".5" stop-color="#FFF4F8"/><stop offset="1" stop-color="#C9A7E8"/></linearGradient></defs>
  <path d="M60 4C28 4 8 28 8 56c0 30 26 52 40 72h24c14-20 40-42 40-72C112 28 92 4 60 4Z" fill="url(#g)"/>
  <path d="M60 4c-14 0-22 24-22 52 0 30 10 52 14 72M60 4c14 0 22 24 22 52 0 30-10 52-14 72" stroke="#090D16" stroke-opacity=".18" fill="none"/>
  <path d="M48 128l4 14M72 128l-4 14" stroke="#5a4a5a" stroke-width="1.5"/>
  <rect x="48" y="142" width="24" height="18" rx="3" fill="#6b4a3a"/>
  <circle cx="60" cy="139" r="3" fill="#FFC27A"/>
</svg>

<section class="picker glass" id="picker" aria-label="목적지 선택">
  <h2>어디로 떠날까요?</h2>
  <p>열기구가 해당 공간으로 데려다줘요.</p>
  <div class="dests">
    <button class="dest" data-dest="Vault"><b>Vault</b><span>프로젝트 저장소</span></button>
    <button class="dest" data-dest="Music"><b>Music</b><span>작곡 스튜디오</span></button>
    <button class="dest" data-dest="Brief"><b>Brief</b><span>드론 배달 브리프</span></button>
    <button class="dest" data-dest="Todo"><b>Todo</b><span>글래스 캘린더</span></button>
    <button class="dest" data-dest="Gallery"><b>Gallery</b><span>전시관</span></button>
  </div>
</section>

<div class="flash" id="flash"></div>
<section class="room" id="room" aria-live="polite">
  <button class="back" id="back">← 도시로</button>
  <div class="panel">
    <div><h3>폴더</h3><div class="row sel">전체</div><div class="row">작곡</div><div class="row">의류</div><div class="row">AI</div></div>
    <div><h3>목록</h3><div class="row sel">신곡 가사 초안</div><div class="row">포트폴리오 리서치</div><div class="row">모델 학습 메모</div></div>
    <div class="ed"><h2 id="roomTitle">Vault</h2><p>도착한 공간의 작업 패널. 입력 중에는 항상 불투명.</p><div class="st">저장됨</div></div>
  </div>
</section>

<script>
const stage = document.getElementById('stage'), balloon = document.getElementById('balloon'),
      picker = document.getElementById('picker'), hint = document.getElementById('hint'),
      flash = document.getElementById('flash'), room = document.getElementById('room');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// 스크롤: 0~35% 도시 감상 → 35~75% 열기구 상승 → 75%~ 목적지 선택
addEventListener('scroll', () => {
  if (document.body.classList.contains('travel')) return;
  const p = scrollY / (document.body.scrollHeight - innerHeight);
  const b = Math.min(Math.max((p - .3) / .45, 0), 1);
  balloon.style.transform = `translateY(${-b * 62}vh) translateX(${-b * 8}vw) scale(${1 + b * .5})`;
  stage.style.transform = `scale(${1 + p * .06}) translateY(${-p * 2}%)`;
  hint.classList.toggle('off', p > .1);
  picker.classList.toggle('on', p > .75);
});

// 이동: 열기구가 광고판(또는 화면 중앙)으로 빨려들어가며 확대 → 도착
function travel(dest, el) {
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  document.getElementById('roomTitle').textContent = dest;
  if (reduce) { room.classList.add('on'); return; }
  document.body.classList.add('travel');
  flash.style.setProperty('--x', cx + 'px'); flash.style.setProperty('--y', cy + 'px');
  balloon.style.transition = 'transform 1.2s cubic-bezier(.6,0,.3,1), left 1.2s cubic-bezier(.6,0,.3,1), top 1.2s cubic-bezier(.6,0,.3,1)';
  balloon.style.left = (cx - 90) + 'px'; balloon.style.top = (cy - 120) + 'px';
  balloon.style.transform = 'scale(.15)';
  stage.style.transformOrigin = `${cx - s.left}px ${cy - s.top}px`;
  stage.style.transform = 'scale(7)'; stage.style.filter = 'blur(6px) brightness(1.3)';
  setTimeout(() => { room.classList.add('on'); document.getElementById('back').focus(); }, 1500);
}
document.querySelectorAll('[data-dest]').forEach(el => el.addEventListener('click', () => travel(el.dataset.dest, el)));

document.getElementById('back').addEventListener('click', () => {
  room.classList.remove('on'); document.body.classList.remove('travel');
  Object.assign(balloon.style, {transition: 'none', left: '', top: '', transform: ''});
  Object.assign(stage.style, {transform: '', filter: '', transformOrigin: ''});
  scrollTo(0, 0);
});
</script>
</body>
</html>
